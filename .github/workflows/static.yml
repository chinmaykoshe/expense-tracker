# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secure Environment Configuration
        run: |
          # Read from GitHub Environment variables/secrets
          # Supports both VITE_FIREBASE_DATABASE_URL and VTTE_FIREBASE_DATABASE_URL
          DB_URL="${{ vars.VITE_FIREBASE_DATABASE_URL || vars.VTTE_FIREBASE_DATABASE_URL || secrets.VITE_FIREBASE_DATABASE_URL || secrets.VTTE_FIREBASE_DATABASE_URL }}"
          DB_NODE="${{ vars.VITE_FIREBASE_NODE || secrets.VITE_FIREBASE_NODE || 'expenseTracker' }}"
          DB_SECRET="${{ secrets.VITE_DATABASE_SECRET || vars.VITE_DATABASE_SECRET || '' }}"

          cat <<EOF > config.js
          window.APP_CONFIG = {
            FIREBASE_DATABASE_URL: "${DB_URL}",
            FIREBASE_NODE: "${DB_NODE}",
            DATABASE_SECRET: "${DB_SECRET}"
          };
          EOF
          echo "Injected config.js from GitHub Environment successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
